
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      max-height: 850px;
      min-height: 480px;
      background: #111827;
      border: 1px solid #273449;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px #0005;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #273449;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #d9f99d;
      color: #17250c;
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    h1 {
      font-size: 19px;
    }

    .status {
      font-size: 12px;
      color: #86efac;
      margin-top: 5px;
    }

    button {
      cursor: pointer;
      border: none;
      font: inherit;
    }

    .clear {
      padding: 9px 12px;
      border-radius: 9px;
      background: #263244;
      color: white;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 480px;
      padding: 20px 0;
    }

    .welcome .big {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9caec4;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .suggestions button {
      background: #1e293b;
      color: #dbeafe;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 90%;
      align-items: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #263449;
      font-size: 16px;
    }

    .user .avatar {
      background: #365314;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 14px;
      background: #1e293b;
      line-height: 1.65;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #365314;
    }

    .error .bubble {
      background: #4c2028;
      color: #fecaca;
    }

    .typing {
      color: #a3b5cb;
      font-size: 13px;
      padding: 8px 0;
    }

    .bottom {
      padding: 15px 18px 10px;
      border-top: 1px solid #273449;
    }

    .input-row {
      display: flex;
      gap: 10px;
      background: #1e293b;
      border: 1px solid #3a4a61;
      border-radius: 15px;
      padding: 8px;
      align-items: flex-end;
    }

    #prompt {
      flex: 1;
      width: 0;
      min-height: 42px;
      max-height: 140px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 12px 8px;
      font: inherit;
      font-size: 14px;
    }

    #prompt::placeholder {
      color: #8292a8;
    }

    #send {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 12px;
      background: #bef264;
      color: #17250c;
      font-size: 20px;
      font-weight: bold;
    }

    #send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      color: #718096;
      font-size: 11px;
      margin-top: 10px;
    }

    @media (max-width: 550px) {
      body { padding: 0; }

      .app {
        height: 100dvh;
        max-height: none;
        min-height: 0;
        border-radius: 0;
        border: none;
      }

      header { padding: 14px; }
      #chat { padding: 15px; }
      .message { max-width: 96%; }
      .welcome h2 { font-size: 23px; }
      .bottom { padding: 10px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">🍌</div>
        <div>
          <h1>Banana AI</h1>
          <div class="status">● AI Assistant</div>
        </div>
      </div>

      <button class="clear" id="clearBtn">🗑 Clear chat</button>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="big">🍌</div>
        <h2>Hey! Main Banana AI hoon.</h2>
        <p>
          Mujhse kuch bhi poochho. Main tumhari coding,
          studies, ideas aur daily questions mein help karunga.
        </p>

        <div class="suggestions">
          <button data-prompt="Mujhe ek website ka code do">
            💻 Website banao
          </button>
          <button data-prompt="JavaScript beginner ke liye samjhao">
            📚 JavaScript sikhao
          </button>
          <button data-prompt="Mujhe ek creative business idea do">
            💡 Ideas do
          </button>
        </div>
      </div>
    </section>

    <footer class="bottom">
      <div class="input-row">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Message Banana AI..."
          aria-label="Apna message likhein"
        ></textarea>

        <button id="send" aria-label="Send message">➤</button>
      </div>
      <div class="hint">
        Enter = Send · Shift + Enter = New line
      </div>
    </footer>
  </main>

  <script>
    // ==========================================
    // GROQ CONFIGURATION
    // Personal testing only. Do not publish a
    // real API key in a public GitHub repository.
    // ==========================================

    const GROQ_API_KEY = "PASTE_YOUR_GROQ_API_KEY_HERE";

    const API_URL =
      "https://api.groq.com/openai/v1/chat/completions";

    const MODEL = "llama-3.3-70b-versatile";

    const SYSTEM_PROMPT = `
You are Banana AI, a friendly and helpful AI assistant.
Reply in the language used by the user.
If the user speaks Hindi or Hinglish, reply in Hindi or Hinglish.
Give clear, useful answers with examples when appropriate.
For coding questions, provide working code and explanations.
Be honest if you do not know something.
`;

    const chat = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clearBtn");

    let messages = [];
    let busy = false;
    let typingElement = null;

    function showWelcome() {
      if (document.getElementById("welcome")) return;

      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.id = "welcome";

      const emoji = document.createElement("div");
      emoji.className = "big";
      emoji.textContent = "🍌";

      const title = document.createElement("h2");
      title.textContent = "Hey! Main Banana AI hoon.";

      const description = document.createElement("p");
      description.textContent =
        "Mujhse kuch bhi poochho. Main tumhari help ke liye yahan hoon.";

      welcome.append(emoji, title, description);
      chat.appendChild(welcome);
    }

    function addMessage(role, text, isError = false) {
      document.getElementById("welcome")?.remove();

      const wrapper = document.createElement("div");
      wrapper.className =
        "message " + (role === "user" ? "user" : "assistant");

      if (isError) wrapper.classList.add("error");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "👤" : "🍌";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      // textContent prevents model output from being
      // interpreted as executable HTML.
      bubble.textContent = text;

      wrapper.append(avatar, bubble);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;

      return wrapper;
    }

    function showTyping() {
      typingElement = document.createElement("div");
      typingElement.className = "typing";
      typingElement.textContent = "🍌 Banana AI is thinking...";
      chat.appendChild(typingElement);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      typingElement?.remove();
      typingElement = null;
    }

    async function sendMessage(customText) {
      const text = (customText ?? promptInput.value).trim();

      if (!text || busy) return;

      if (
        !GROQ_API_KEY ||
        GROQ_API_KEY === "PASTE_YOUR_GROQ_API_KEY_HERE"
      ) {
        addMessage(
          "assistant",
          "Pehle index.html mein GROQ_API_KEY set karo. Public website par asli key expose mat karna.",
          true
        );
        return;
      }

      busy = true;
      sendBtn.disabled = true;
      promptInput.disabled = true;

      promptInput.value = "";
      promptInput.style.height = "42px";

      addMessage("user", text);

      messages.push({
        role: "user",
        content: text
      });

      showTyping();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              {
                role: "system",
                content: SYSTEM_PROMPT
              },
              ...messages.slice(-20)
            ],
            temperature: 0.7,
            max_tokens: 2048
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const errorMessage =
            data?.error?.message ||
            "API request failed with status " + response.status;

          throw new Error(errorMessage);
        }

        const answer =
          data?.choices?.[0]?.message?.content;

        if (typeof answer !== "string" || !answer.trim()) {
          throw new Error("AI se empty response mila.");
        }

        messages.push({
          role: "assistant",
          content: answer
        });

        addMessage("assistant", answer);

      } catch (error) {
        // Remove the failed user request from history,
        // allowing the user to retry.
        messages.pop();

        console.error("Banana AI error:", error);

        addMessage(
          "assistant",
          "Sorry! Response nahi aa paya.\n\n" +
          error.message +
          "\n\nAPI key, model, account limits aur network check karo.",
          true
        );
      } finally {
        hideTyping();
        busy = false;
        sendBtn.disabled = false;
        promptInput.disabled = false;
        promptInput.focus();
      }
    }

    sendBtn.addEventListener("click", () => {
      sendMessage();
    });

    promptInput.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        sendMessage();
      }
    });

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "42px";
      promptInput.style.height =
        Math.min(promptInput.scrollHeight, 140) + "px";
    });

    document.querySelectorAll("[data-prompt]").forEach((button) => {
      button.addEventListener("click", () => {
        sendMessage(button.dataset.prompt);
      });
    });

    clearBtn.addEventListener("click", () => {
      if (busy) return;

      messages = [];
      chat.innerHTML = "";
      showWelcome();
      promptInput.focus();
    });
  </script>
</body>
</html>
